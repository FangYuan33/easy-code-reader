name: Publish to PyPI

on:
  # 触发方式 1: 创建新的 GitHub Release 时自动发布
  release:
    types: [published]
  
  # 触发方式 2: 手动触发工作流
  workflow_dispatch:
    inputs:
      test_pypi:
        description: '发布到测试 PyPI'
        required: false
        type: boolean
        default: false

jobs:
  verify:
    uses: ./.github/workflows/tests.yml

  build-and-publish:
    needs: verify
    name: 构建并发布 Python 包
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PACKAGE_NAME: easy-code-reader
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 获取完整历史，用于版本标签
    
    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: 显示 Python 版本
      run: |
        python --version
        pip --version
    
    - name: 安装构建工具
      run: |
        python -m pip install --upgrade pip
        pip install build twine tomli
    
    - name: 获取版本信息（从 pyproject.toml 解析）
      id: get_version
      run: |
        python - <<'PY'
        import os
        try:
            import tomllib  # Py3.11+
        except ModuleNotFoundError:
            import tomli as tomllib  # Py3.10 fallback
        with open('pyproject.toml', 'rb') as f:
            data = tomllib.load(f)
        version = data['project']['version']
        print(f"📦 版本号: {version}")
        with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
            fh.write(f"version={version}\n")
        PY

    - name: 校验 Release 标签与版本一致（仅在 release 事件）
      if: github.event_name == 'release'
      run: |
        VERSION='${{ steps.get_version.outputs.version }}'
        if [ -n "${{ github.event.release.tag_name }}" ]; then
          TAG='${{ github.event.release.tag_name }}'
        else
          TAG='${{ github.ref_name }}'
        fi
        echo "Release tag: ${TAG}"
        if [ "v${VERSION}" != "${TAG}" ]; then
          echo "❌ 版本号与标签不一致: version=v${VERSION}, tag=${TAG}"
          exit 1
        fi
        echo "✓ 版本号与标签一致"
    
    - name: 清理旧的构建文件
      run: |
        rm -rf dist/ build/ *.egg-info src/*.egg-info
    
    - name: 构建包
      run: |
        python -m build
        echo "✓ 构建完成"
        echo "构建的文件:"
        ls -lh dist/
    
    - name: 检查包
      run: |
        twine check dist/*
        echo "✓ 包检查通过"
    
    - name: 发布到测试 PyPI
      if: github.event.inputs.test_pypi == 'true'
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
      run: |
        echo "📤 上传到测试 PyPI..."
        twine upload --repository testpypi dist/*
        echo "✓ 发布成功！"
        echo "📦 包地址: https://test.pypi.org/project/${PACKAGE_NAME}/${{ steps.get_version.outputs.version }}/"
    
    - name: 发布到正式 PyPI
      if: github.event.inputs.test_pypi != 'true'
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        echo "📤 上传到正式 PyPI..."
        twine upload dist/*
        echo "✓ 发布成功！🎉"
        echo "📦 包地址: https://pypi.org/project/${PACKAGE_NAME}/${{ steps.get_version.outputs.version }}/"
    
    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    
    - name: 创建发布摘要
      run: |
        echo "## 🎉 发布成功！" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**版本:** ${{ steps.get_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "**包名:** ${PACKAGE_NAME}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ "${{ github.event.inputs.test_pypi }}" == "true" ]; then
          echo "**仓库:** 测试 PyPI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 安装测试" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ ${PACKAGE_NAME}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        else
          echo "**仓库:** 正式 PyPI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 安装" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "pip install ${PACKAGE_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "# 或" >> $GITHUB_STEP_SUMMARY
          echo "uvx ${PACKAGE_NAME}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi
