name: Tests

on:
  pull_request:
  push:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.12']
        java: ['11', '21']
        include:
          - os: macos-latest
            python: '3.12'
            java: '21'
          - os: windows-latest
            python: '3.12'
            java: '11'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m build
      - name: Validate and install wheel in an isolated environment
        shell: bash
        run: |
          python -m twine check dist/*
          python -m venv wheel-venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            WHEEL_PYTHON=wheel-venv/Scripts/python.exe
          else
            WHEEL_PYTHON=wheel-venv/bin/python
          fi
          "$WHEEL_PYTHON" -m pip install dist/*.whl
          "$WHEEL_PYTHON" scripts/smoke_test.py
